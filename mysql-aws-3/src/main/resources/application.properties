
# =============================================
# Configuración de la Aplicación — AWS ECS
# =============================================

spring.application.name=bdget

# --- Base de Datos MySQL ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/bdget_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bdget_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bdget_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- HikariCP ---
spring.datasource.hikari.connection-timeout=3000

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Servidor ---
server.port=8080

# --- Logs ---
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO

# --- Actuator: health checks para ECS ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
