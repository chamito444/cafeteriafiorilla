
name: CI — Tests, Calidad y Seguridad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mysql-local-2.4/mysql-local-2.4

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_pass
          MYSQL_DATABASE: bdget_db
          MYSQL_USER: bdget_user
          MYSQL_PASSWORD: bdget_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot_pass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # 1. Descargar el código con historial completo
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configurar Java 21; el proyecto mantiene target Java 17
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: mysql-local-2.4/mysql-local-2.4/pom.xml

      # 3. Ejecutar tests y generar cobertura JaCoCo
      - name: Ejecutar tests
        run: mvn test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/bdget_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: bdget_user
          SPRING_DATASOURCE_PASSWORD: bdget_pass

      # 4. Subir el reporte de cobertura
      - name: Subir reporte JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: mysql-local-2.4/mysql-local-2.4/target/site/jacoco/

      # 5. Análisis SonarCloud
      - name: Análisis SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.projectKey="${{ secrets.SONAR_PROJECT_KEY }}" \
            -Dsonar.organization="${{ secrets.SONAR_ORGANIZATION }}" \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      # 6. Escanear dependencias Maven con Snyk
      - name: Escaneo de vulnerabilidades Snyk (dependencias)
        uses: snyk/actions/maven@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=mysql-local-2.4/mysql-local-2.4/pom.xml

      # 7. Compilar el proyecto
      - name: Build del proyecto
        run: mvn package -DskipTests

      # 8. Iniciar sesión en DockerHub
      - name: Login en DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 9. Construir la imagen Docker
      - name: Build de la imagen Docker
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/bdget-app:latest .

      # 10. Escanear la imagen con Snyk
      - name: Escaneo de imagen Docker con Snyk
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ secrets.DOCKERHUB_USERNAME }}/bdget-app:latest
          args: --severity-threshold=high

      # 11. Publicar la imagen en DockerHub
      - name: Push de la imagen a DockerHub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/bdget-app:latest

